# Render Blueprint — deploys the LoopCode API (Node + SQLite on a persistent
# disk) and the web app (static site) together.
# Docs: https://render.com/docs/blueprint-spec
#
# After the first deploy, open the loopcode-api service's Shell and run
# `npm run db:seed` once to populate the demo data.

services:
  # ── API ────────────────────────────────────────────────────────────────────
  - type: web
    name: loopcode-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        # Stored on the persistent disk mounted below.
        value: file:/var/data/prod.db
      - key: PORT
        value: "4000"
    disk:
      name: loopcode-data
      mountPath: /var/data
      sizeGB: 1

  # ── Web (static SPA) ────────────────────────────────────────────────────────
  - type: web
    name: loopcode-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Point the built frontend at the API service. Update the host to match
      # your API service's public URL.
      - key: VITE_API_URL
        value: https://loopcode-api.onrender.com
    routes:
      # SPA fallback so client-side routes (/dashboard, /mastery, …) work on refresh.
      - type: rewrite
        source: /*
        destination: /index.html
